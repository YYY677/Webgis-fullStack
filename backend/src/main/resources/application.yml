server:
  port: 8080

spring:
  application:
    name: webgis-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/webgis
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    create-schemas: true
    schemas: business_data, spatial_data

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 60MB

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.webgis.*.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# GeoServer
geoserver:
  url: http://localhost:8081/geoserver
  username: admin
  password: geoserver
  workspace: webgis

# JWT
jwt:
  secret: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3ODkwYWJjZGVmZ2hpamtsbW5vcA==
