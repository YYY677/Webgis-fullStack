# 前端生产入口：只暴露此 Nginx 服务，其他容器均使用 Compose 内部 DNS 名称访问。
server {
    listen 80;
    server_name _;

    # Shapefile ZIP 等空间数据上传会经过后端代理，必须与 Spring Boot 的 60 MB 限制匹配。
    client_max_body_size 60m;

    # REST API 不对浏览器公开；后端和 catalog-sync 通过内部网络直接调用它。
    # /geoserver/web 管理后台保留认证访问，公网部署时应在此基础上增加内网或 IP 白名单。
    location ~ ^/geoserver/rest(?:/|$) {
        return 404;
    }

    # 后端 API：proxy_pass 不带路径，保留浏览器请求中的 /api 前缀。
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WMS/WFS/WMTS 与 GWC 瓦片直接由 GeoServer 返回，保留 /geoserver 前缀。
    location /geoserver/ {
        proxy_pass http://geoserver:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Vue 使用 Hash 路由，但保留 SPA 回退便于访问根路径及未来普通路由。
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
